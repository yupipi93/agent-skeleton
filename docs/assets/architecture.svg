<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
<title id="t">agent-skeleton architecture</title>
<desc id="d">Sources (kit bundles, tool config templates, skeleton.toml, skeleton.local.toml, local private bundles) feed bin/skeleton init, which loads, resolves, plans and applies, generating native files for Claude Code, Cursor, Gemini CLI and Antigravity. AGENTS.md is the one shared instructions file.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121826"/><stop offset="1" stop-color="#1b2236"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2440"/><stop offset="1" stop-color="#151b2e"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7896"/></marker>
<style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}</style>
</defs>
