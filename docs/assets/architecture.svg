<text x="458" y="202" class="mono" font-size="22" font-weight="700" fill="#f3f5fa">bin/skeleton <tspan fill="#f6b44b">init</tspan></text>
<text x="458" y="226" font-size="13.5" fill="#8e99b3">one stdlib-only Python file, no install step</text>
<g transform="translate(454 250)">
<rect width="330" height="62" rx="12" fill="#0f1420" stroke="#2c3550"/>
