<text x="20" y="70" font-size="13.5" fill="#c9d1e3">rules/&lt;r&gt;.md (neutral)</text>
<text x="20" y="89" font-size="13.5" fill="#c9d1e3">hooks.toml, mcp.toml</text>
<text x="20" y="108" font-size="13.5" fill="#c9d1e3">scripts/, setup.sh</text>
</g>
