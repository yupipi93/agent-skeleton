<text x="30" y="36" text-anchor="middle" font-size="14" font-weight="800" fill="#fcd38a">1</text>
<text x="58" y="27" font-size="16" font-weight="700" fill="#f3f5fa">Load</text>
<text x="58" y="47" font-size="13" fill="#8e99b3">manifests merged, bundles parsed</text>
</g>
<g transform="translate(454 322)">
<rect width="330" height="62" rx="12" fill="#0f1420" stroke="#2c3550"/>
<circle cx="30" cy="31" r="15" fill="#3a2a10" stroke="#f6b44b"/>
<text x="30" y="36" text-anchor="middle" font-size="14" font-weight="800" fill="#fcd38a">2</text>
<text x="58" y="27" font-size="16" font-weight="700" fill="#f3f5fa">Resolve</text>
<text x="58" y="47" font-size="13" fill="#8e99b3">bundle, skill, rule, hook and MCP state</text>
</g>
<g transform="translate(454 394)">
<rect width="330" height="62" rx="12" fill="#0f1420" stroke="#2c3550"/>
<circle cx="30" cy="31" r="15" fill="#3a2a10" stroke="#f6b44b"/>
<text x="30" y="36" text-anchor="middle" font-size="14" font-weight="800" fill="#fcd38a">3</text>
<text x="58" y="27" font-size="16" font-weight="700" fill="#f3f5fa">Plan</text>
<text x="58" y="47" font-size="13" fill="#8e99b3">path to file or link, a pure function</text>
</g>
<g transform="translate(454 466)">
<rect width="330" height="62" rx="12" fill="#0f1420" stroke="#2c3550"/>
<circle cx="30" cy="31" r="15" fill="#3a2a10" stroke="#f6b44b"/>
<text x="30" y="36" text-anchor="middle" font-size="14" font-weight="800" fill="#fcd38a">4</text>
<text x="58" y="27" font-size="16" font-weight="700" fill="#f3f5fa">Apply</text>
<text x="58" y="47" font-size="13" fill="#8e99b3">write on change, prune, record manifest</text>
</g>
<text x="619.0" y="564" text-anchor="middle" font-size="13" fill="#8e99b3">idempotent, never writes into kit/ or local/</text>
