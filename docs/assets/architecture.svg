<text x="1030" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#6ee7b7">committed</text>
<text x="34" y="100" font-size="13" font-weight="700" fill="#6b7896" letter-spacing="1.5">SOURCES</text>
<text x="434" y="100" font-size="13" font-weight="700" fill="#6b7896" letter-spacing="1.5">RENDER</text>
<text x="864" y="100" font-size="13" font-weight="700" fill="#6b7896" letter-spacing="1.5">NATIVE CONFIG PER TOOL</text>
<g transform="translate(34 116)">
