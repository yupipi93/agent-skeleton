<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">agent-skeleton</title>
  <desc id="d">One source of truth for your AI coding agents: skills, rules, hooks and MCP rendered natively for Claude Code, Cursor, Gemini CLI and Antigravity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121826"/>
      <stop offset="1" stop-color="#1b2236"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6b44b"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#3b4b7a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3b4b7a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect x="1" y="1" width="1278" height="358" rx="28" fill="url(#bg)" stroke="#2c3550" stroke-width="2"/>
  <rect x="1" y="1" width="1278" height="358" rx="28" fill="url(#dots)"/>
  <rect x="1" y="1" width="1278" height="358" rx="28" fill="url(#glow)"/>

  <!-- logo mark: a spine of stacked vertebrae -->
  <g transform="translate(72 92)">
    <rect width="104" height="104" rx="26" fill="url(#mark)"/>
    <rect x="48" y="10" width="8" height="84" rx="4" fill="#1b1209" fill-opacity="0.45"/>
    <g fill="#1b1209">
      <rect x="34" y="16" width="36" height="11" rx="5.5"/>
      <rect x="28" y="32" width="48" height="11" rx="5.5"/>
      <rect x="24" y="48" width="56" height="11" rx="5.5"/>
      <rect x="28" y="64" width="48" height="11" rx="5.5"/>
      <rect x="34" y="80" width="36" height="11" rx="5.5"/>
    </g>
  </g>

  <text x="200" y="150" class="sans" font-size="60" font-weight="800" fill="#f3f5fa" letter-spacing="-1">agent-skeleton</text>
  <text x="202" y="190" class="sans" font-size="23" font-weight="500" fill="#c9d1e3">One source of truth for your AI coding agents.</text>
  <text x="202" y="222" class="sans" font-size="19" fill="#8e99b3">Skills, rules, hooks and MCP, rendered natively for every tool.</text>

  <!-- command pill -->
  <g transform="translate(200 254)">
    <rect width="250" height="44" rx="12" fill="#0b0f19" stroke="#2c3550"/>
    <text x="18" y="28" class="mono" font-size="17" fill="#6b7896">$</text>
    <text x="38" y="28" class="mono" font-size="17" fill="#e8ecf4">bin/skeleton <tspan fill="#f6b44b">init</tspan></text>
    <rect x="220" y="13" width="2" height="19" fill="#f6b44b">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- fan out: kit to four tools -->
  <g class="sans">
    <g fill="none" stroke-width="2.5" stroke-linecap="round">
      <path d="M 918 180 C 970 180, 970 72, 1020 72" stroke="#ff7a59"/>
      <path d="M 918 180 C 970 180, 970 140, 1020 140" stroke="#e5e7eb" stroke-opacity="0.8"/>
      <path d="M 918 180 C 970 180, 970 212, 1020 212" stroke="#60a5fa"/>
      <path d="M 918 180 C 970 180, 970 280, 1020 280" stroke="#a78bfa"/>
    </g>

    <g transform="translate(762 140)">
      <rect width="156" height="80" rx="16" fill="#0b0f19" stroke="#f6b44b" stroke-width="2"/>
      <text x="78" y="34" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#f6b44b">kit/bundles</text>
      <text x="78" y="58" text-anchor="middle" font-size="14" fill="#8e99b3">11 bundles, 39 skills</text>
    </g>

    <g transform="translate(1020 48)">
      <rect width="196" height="48" rx="12" fill="#231a1a" stroke="#ff7a59" stroke-width="1.5"/>
      <circle cx="24" cy="24" r="7" fill="#ff7a59"/>
      <text x="42" y="30" font-size="17" font-weight="600" fill="#f3f5fa">Claude Code</text>
    </g>
    <g transform="translate(1020 116)">
      <rect width="196" height="48" rx="12" fill="#1c1f26" stroke="#e5e7eb" stroke-opacity="0.7" stroke-width="1.5"/>
      <circle cx="24" cy="24" r="7" fill="#e5e7eb"/>
      <text x="42" y="30" font-size="17" font-weight="600" fill="#f3f5fa">Cursor</text>
    </g>
    <g transform="translate(1020 188)">
      <rect width="196" height="48" rx="12" fill="#16203a" stroke="#60a5fa" stroke-width="1.5"/>
      <circle cx="24" cy="24" r="7" fill="#60a5fa"/>
      <text x="42" y="30" font-size="17" font-weight="600" fill="#f3f5fa">Gemini CLI</text>
    </g>
    <g transform="translate(1020 256)">
      <rect width="196" height="48" rx="12" fill="#1f1a33" stroke="#a78bfa" stroke-width="1.5"/>
      <circle cx="24" cy="24" r="7" fill="#a78bfa"/>
      <text x="42" y="30" font-size="17" font-weight="600" fill="#f3f5fa">Antigravity</text>
    </g>
  </g>
</svg>
