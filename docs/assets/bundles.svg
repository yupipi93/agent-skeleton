      <text x="40" y="53" text-anchor="middle" class="emoji" font-size="24">📝</text>
      <text x="74" y="51" class="mono" font-size="20" font-weight="700" fill="#f3f5fa">docs</text>
      <rect x="228" y="32" width="44" height="24" rx="12" fill="#12382b" stroke="#34d399"/><text x="250" y="49" text-anchor="middle" font-size="12" font-weight="700" fill="#6ee7b7">ON</text>
      <text x="22" y="96" font-size="15" fill="#c9d1e3">One Mermaid house style, print-</text>
