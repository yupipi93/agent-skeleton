      <text x="74" y="51" class="mono" font-size="20" font-weight="700" fill="#f3f5fa">gcp</text>
      <rect x="228" y="32" width="44" height="24" rx="12" fill="#12382b" stroke="#34d399"/><text x="250" y="49" text-anchor="middle" font-size="12" font-weight="700" fill="#6ee7b7">ON</text>
      <text x="22" y="96" font-size="15" fill="#c9d1e3">The right gcloud account per</text>
      <text x="22" y="117" font-size="15" fill="#c9d1e3">project, IAP smoke tests as the</text>
      <text x="22" y="138" font-size="15" fill="#c9d1e3">real caller, billing PDF.</text>
      <text x="22" y="166" font-size="13" fill="#38bdf8" fill-opacity="0.95">6 skills, 1 rule</text>
    </g>
    <g transform="translate(340 302)">
      <rect width="290" height="186" rx="18" fill="#0f1420" stroke="#2c3550" stroke-width="1.5"/>
      <rect x="18" y="0" width="64" height="4" rx="2" fill="#2dd4bf"/>
