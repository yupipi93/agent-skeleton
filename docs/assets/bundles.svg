      <circle cx="40" cy="44" r="22" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.55"/>
      <text x="40" y="53" text-anchor="middle" class="emoji" font-size="24">🏗️</text>
      <text x="74" y="51" class="mono" font-size="20" font-weight="700" fill="#f3f5fa">terraform</text>
      <rect x="228" y="32" width="44" height="24" rx="12" fill="#12382b" stroke="#34d399"/><text x="250" y="49" text-anchor="middle" font-size="12" font-weight="700" fill="#6ee7b7">ON</text>
      <text x="22" y="96" font-size="15" fill="#c9d1e3">The agent plans, you apply.</text>
      <text x="22" y="117" font-size="15" fill="#c9d1e3">Destroys first, copy-paste</text>
      <text x="22" y="138" font-size="15" fill="#c9d1e3">-target sets, state traps.</text>
      <text x="22" y="166" font-size="13" fill="#a78bfa" fill-opacity="0.95">5 skills, 1 rule</text>
    </g>
