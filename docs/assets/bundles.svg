<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="724" viewBox="0 0 1280 724" role="img" aria-labelledby="t d">
  <title id="t">agent-skeleton bundles</title>
  <desc id="d">Eleven feature bundles: core, git, jira, terraform, gcp, docs, loops and mac are on by default; voice, google and style are off by default; private bundles go in local/bundles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121826"/><stop offset="1" stop-color="#1b2236"/></linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .emoji { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
    </style>
  </defs>
  <rect x="1" y="1" width="1278" height="722" rx="28" fill="url(#bg)" stroke="#2c3550" stroke-width="2"/>
  <g class="sans">
    <text x="34" y="54" font-size="28" font-weight="800" fill="#f3f5fa">What you get</text>
    <text x="226" y="54" font-size="18" fill="#8e99b3">11 bundles. Toggle any bundle, skill, rule or hook.</text>
    <g transform="translate(950 32)">
      <rect width="44" height="24" rx="12" fill="#12382b" stroke="#34d399"/><text x="22" y="17" text-anchor="middle" font-size="12" font-weight="700" fill="#6ee7b7">ON</text>
      <text x="54" y="17" font-size="14" fill="#8e99b3">default on</text>
      <rect x="146" width="48" height="24" rx="12" fill="#232a3b" stroke="#55607a"/><text x="170" y="17" text-anchor="middle" font-size="12" font-weight="700" fill="#aab3c5">OFF</text>
      <text x="204" y="17" font-size="14" fill="#8e99b3">opt in</text>
    </g>
    <g transform="translate(30 96)">
      <rect width="290" height="186" rx="18" fill="#0f1420" stroke="#2c3550" stroke-width="1.5"/>
      <rect x="18" y="0" width="64" height="4" rx="2" fill="#f6b44b"/>
      <circle cx="40" cy="44" r="22" fill="#f6b44b" fill-opacity="0.16" stroke="#f6b44b" stroke-opacity="0.55"/>
      <text x="40" y="53" text-anchor="middle" class="emoji" font-size="24">🦴</text>
      <text x="74" y="51" class="mono" font-size="20" font-weight="700" fill="#f3f5fa">core</text>
      <rect x="228" y="32" width="44" height="24" rx="12" fill="#12382b" stroke="#34d399"/><text x="250" y="49" text-anchor="middle" font-size="12" font-weight="700" fill="#6ee7b7">ON</text>
      <text x="22" y="96" font-size="15" fill="#c9d1e3">Safety-gate rules, the workspace</text>
      <text x="22" y="117" font-size="15" fill="#c9d1e3">guide, skill authoring and the</text>
      <text x="22" y="138" font-size="15" fill="#c9d1e3">shared script library.</text>
      <text x="22" y="166" font-size="13" fill="#f6b44b" fill-opacity="0.95">4 skills, 3 rules</text>
    </g>
    <g transform="translate(340 96)">
      <rect width="290" height="186" rx="18" fill="#0f1420" stroke="#2c3550" stroke-width="1.5"/>
      <rect x="18" y="0" width="64" height="4" rx="2" fill="#34d399"/>
      <circle cx="40" cy="44" r="22" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-opacity="0.55"/>
      <text x="40" y="53" text-anchor="middle" class="emoji" font-size="24">🌿</text>
      <text x="74" y="51" class="mono" font-size="20" font-weight="700" fill="#f3f5fa">git</text>
      <rect x="228" y="32" width="44" height="24" rx="12" fill="#12382b" stroke="#34d399"/><text x="250" y="49" text-anchor="middle" font-size="12" font-weight="700" fill="#6ee7b7">ON</text>
      <text x="22" y="96" font-size="15" fill="#c9d1e3">Every agent write in its own</text>
      <text x="22" y="117" font-size="15" fill="#c9d1e3">worktree. Every PR ships a real</text>
      <text x="22" y="138" font-size="15" fill="#c9d1e3">body, on GitHub or Bitbucket.</text>
      <text x="22" y="166" font-size="13" fill="#34d399" fill-opacity="0.95">6 skills, 1 rule</text>
    </g>
