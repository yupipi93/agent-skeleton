      <text x="74" y="51" class="mono" font-size="20" font-weight="700" fill="#f3f5fa">jira</text>
      <rect x="228" y="32" width="44" height="24" rx="12" fill="#12382b" stroke="#34d399"/><text x="250" y="49" text-anchor="middle" font-size="12" font-weight="700" fill="#6ee7b7">ON</text>
      <text x="22" y="96" font-size="15" fill="#c9d1e3">Jira Cloud without an MCP: forms,</text>
      <text x="22" y="117" font-size="15" fill="#c9d1e3">rich ADF text, safe transitions,</text>
      <text x="22" y="138" font-size="15" fill="#c9d1e3">secrets never on argv.</text>
      <text x="22" y="166" font-size="13" fill="#60a5fa" fill-opacity="0.95">4 skills, 2 rules, 2 hooks</text>
    </g>
