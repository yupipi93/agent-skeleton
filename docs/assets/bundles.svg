      <rect x="18" y="0" width="64" height="4" rx="2" fill="#60a5fa"/>
      <circle cx="40" cy="44" r="22" fill="#60a5fa" fill-opacity="0.16" stroke="#60a5fa" stroke-opacity="0.55"/>
