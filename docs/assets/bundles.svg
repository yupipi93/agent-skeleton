      <rect x="224" y="32" width="48" height="24" rx="12" fill="#232a3b" stroke="#55607a"/><text x="248" y="49" text-anchor="middle" font-size="12" font-weight="700" fill="#aab3c5">OFF</text>
      <text x="22" y="96" font-size="15" fill="#c9d1e3">Agents that say who they are.</text>
      <text x="22" y="117" font-size="15" fill="#c9d1e3">Spoken summaries in a local hub;</text>
      <text x="22" y="138" font-size="15" fill="#c9d1e3">Telegram or Chat if you opt in.</text>
      <text x="22" y="166" font-size="13" fill="#ff7a59" fill-opacity="0.95">3 skills, 1 rule, 1 hook</text>
