<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">agent-skeleton</title>
  <desc id="d">Social preview: one kit of skills, rules, hooks and MCP for Claude Code, Cursor, Gemini CLI and Antigravity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121826"/>
      <stop offset="1" stop-color="#1b2236"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6b44b"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#3b4b7a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3b4b7a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .emoji { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <g transform="translate(580 70)">
    <rect width="120" height="120" rx="30" fill="url(#mark)"/>
    <rect x="56" y="12" width="8" height="96" rx="4" fill="#1b1209" fill-opacity="0.45"/>
    <g fill="#1b1209">
      <rect x="40" y="18" width="40" height="13" rx="6.5"/>
      <rect x="33" y="37" width="54" height="13" rx="6.5"/>
      <rect x="28" y="56" width="64" height="13" rx="6.5"/>
      <rect x="33" y="75" width="54" height="13" rx="6.5"/>
      <rect x="40" y="94" width="40" height="13" rx="6.5"/>
    </g>
  </g>

  <g class="sans" text-anchor="middle">
    <text x="640" y="278" font-size="84" font-weight="800" fill="#f3f5fa" letter-spacing="-1.5">agent-skeleton</text>
    <text x="640" y="334" font-size="30" font-weight="500" fill="#c9d1e3">One source of truth for your AI coding agents.</text>
    <text x="640" y="374" font-size="22" fill="#8e99b3">Skills, rules, hooks and MCP, rendered natively for every tool. Toggle anything.</text>
  </g>

  <g class="sans" font-size="20" font-weight="600" fill="#f3f5fa">
    <g transform="translate(186 420)">
      <rect width="210" height="54" rx="14" fill="#231a1a" stroke="#ff7a59" stroke-width="1.5"/>
      <circle cx="28" cy="27" r="8" fill="#ff7a59"/>
      <text x="48" y="34">Claude Code</text>
    </g>
    <g transform="translate(416 420)">
      <rect width="210" height="54" rx="14" fill="#1c1f26" stroke="#e5e7eb" stroke-opacity="0.7" stroke-width="1.5"/>
      <circle cx="28" cy="27" r="8" fill="#e5e7eb"/>
      <text x="48" y="34">Cursor</text>
    </g>
    <g transform="translate(646 420)">
      <rect width="210" height="54" rx="14" fill="#16203a" stroke="#60a5fa" stroke-width="1.5"/>
      <circle cx="28" cy="27" r="8" fill="#60a5fa"/>
      <text x="48" y="34">Gemini CLI</text>
    </g>
    <g transform="translate(876 420)">
      <rect width="210" height="54" rx="14" fill="#1f1a33" stroke="#a78bfa" stroke-width="1.5"/>
      <circle cx="28" cy="27" r="8" fill="#a78bfa"/>
      <text x="48" y="34">Antigravity</text>
    </g>
  </g>

  <g class="mono" font-size="17" fill="#8e99b3" text-anchor="middle">
    <text x="640" y="548"><tspan class="emoji">🦴</tspan> core  <tspan class="emoji">🌿</tspan> git  <tspan class="emoji">🎫</tspan> jira  <tspan class="emoji">🏗️</tspan> terraform  <tspan class="emoji">☁️</tspan> gcp  <tspan class="emoji">📝</tspan> docs  <tspan class="emoji">🔁</tspan> loops  <tspan class="emoji">🎧</tspan> voice  <tspan class="emoji">📬</tspan> google  <tspan class="emoji">🍎</tspan> mac</text>
  </g>
</svg>
