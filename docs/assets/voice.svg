<text x="996" y="204" text-anchor="middle" font-size="12.5" fill="#7aa7ff">PROJ-123</text>
<text x="588" y="250" font-size="12" font-weight="700" fill="#6b7896" letter-spacing="1.2">TRANSCRIPT</text>
<rect x="580" y="262" width="648" height="32" rx="8" fill="#3a261d"/>
<text x="588" y="284" font-size="16" font-weight="600" fill="#ef8a63">Hi, Ana. This is the payments agent, about Terraform.</text>
<text x="588" y="318" font-size="16" fill="#eceef1">The plan is clean: two resources to add, nothing to destroy.</text>
<text x="588" y="346" font-size="16" fill="#9aa0aa">I need one thing from you: approve the apply. The command</text>
<text x="588" y="370" font-size="16" fill="#9aa0aa">is in the chat.</text>
<rect x="580" y="392" width="648" height="56" rx="12" fill="#24272c" stroke="#2d3036"/>
<text x="596" y="414" font-size="12" font-weight="700" fill="#ef8a63" letter-spacing="1">FOR YOU</text>
<text x="596" y="435" class="mono" font-size="14" fill="#eceef1">terraform apply dev.tfplan</text>
