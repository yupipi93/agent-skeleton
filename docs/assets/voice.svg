<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="t d">
<title id="t">Voice summaries</title>
<desc id="d">By default a spoken summary goes to the local voice hub, which plays it at 1x to 2.5x with a follow-along transcript and the command left for you, and the agent reply carries a Listen link. Telegram and Google Chat are optional channels, off until you opt in.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121826"/><stop offset="1" stop-color="#1b2236"/></linearGradient>
<style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}</style>
</defs>
<rect x="1" y="1" width="1278" height="598" rx="28" fill="url(#bg)" stroke="#2c3550" stroke-width="2"/>
<g class="sans">
<text x="34" y="54" font-size="28" font-weight="800" fill="#f3f5fa">Voice summaries</text>
<text x="300" y="54" font-size="18" fill="#8e99b3">Long turns end with a note that plays on your machine.</text>

<!-- The local voice hub: the default destination -->
