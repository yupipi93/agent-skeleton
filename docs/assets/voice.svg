<text x="588" y="284" font-size="16" font-weight="600" fill="#ef8a63">Hi, Ana. This is the payments agent, about Terraform.</text>
<text x="588" y="318" font-size="16" fill="#eceef1">The plan is clean: two resources to add, nothing to destroy.</text>
<text x="588" y="346" font-size="16" fill="#9aa0aa">I need one thing from you: approve the apply. The command</text>
<text x="588" y="370" font-size="16" fill="#9aa0aa">is in the chat.</text>
