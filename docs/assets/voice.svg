<line x1="750" y1="136" x2="1246" y2="136" stroke="#2c3550"/>
<text x="772" y="166" font-size="14" fill="#c9d1e3">The plan is reviewed. Run this when you agree:</text>
<rect x="772" y="180" width="452" height="38" rx="10" fill="#0b0f19" stroke="#2c3550"/>
<text x="788" y="204" class="mono" font-size="14" fill="#e6e9ef"><tspan fill="#6b7896">$ </tspan>terraform apply dev.tfplan</text>
<text x="772" y="250" font-size="15"><tspan class="emoji">🎧</tspan><tspan fill="#7aa7ff" text-decoration="underline"> Listen: Terraform plan ready</tspan></text>
