# Synthetic example report. Every figure is invented; it exists to show each field
# and to let you (and the test suite) run the generator end to end.
#
#   python3 tools/billing-exec-report/generate.py \
#     --config tools/billing-exec-report/examples/sample/report.toml --pdf
#
# For a real report copy this file and services.csv into
# tools/billing-exec-report/reports/<slug>/ (git-ignored). Everything the report
# says comes from the CSV plus the values declared here; nothing is asked at run
# time.
#
# TOML note: top-level keys must come before the first [table], so the three
# top-level settings (rest_label, always_on, daily) are at the top.

# Label for everything that is not the focus service.
rest_label = "Everything else"

# Services that bill whether or not anyone uses the product: the always-on floor.
# Test: would this line still bill if nobody touched the product for a week?
always_on = [
  "Compute Engine",
  "Cloud SQL",
  "Networking",
  "Secret Manager",
  "Artifact Registry",
]

# Optional daily series reconstructed from the console chart. It is rescaled to
# the exported subtotal and labelled approximate: the shape is indicative, only
# the total is exact. Prefer input.daily_csv when you have a per-day export.
daily = [
  { date = 2026-08-01, amount = 168.0 },
  { date = 2026-08-02, amount = 171.5 },
  { date = 2026-08-03, amount = 165.2 },
  { date = 2026-08-04, amount = 174.8 },
  { date = 2026-08-05, amount = 180.1 },
  { date = 2026-08-06, amount = 176.4 },
  { date = 2026-08-07, amount = 169.9 },
  { date = 2026-08-08, amount = 166.3 },
  { date = 2026-08-09, amount = 172.0 },
  { date = 2026-08-10, amount = 205.6 },
  { date = 2026-08-11, amount = 221.4 },
  { date = 2026-08-12, amount = 248.9 },
  { date = 2026-08-13, amount = 210.2 },
  { date = 2026-08-14, amount = 189.7 },
  { date = 2026-08-15, amount = 186.1 },
  { date = 2026-08-16, amount = 191.2 },
]

[report]
title = "Example platform cloud cost"
subtitle = "Executive summary"
# Plain-language name of what is billed. Never a raw project id.
entity = "Example platform, production environment"
period_label = "August 2026"
period_start = 2026-08-01
period_end = 2026-08-31
# Last day with complete billed data (usually yesterday). Everything per day
# divides by this, so a wrong value scales every rate and projection.
data_through = 2026-08-16
generated_on = 2026-08-17
currency = "USD"
currency_symbol = "$"

[input]
# Billing console: Reports, group by Service, filter to the project or label,
# Download CSV. Relative paths resolve next to this file.
services_csv = "services.csv"
# daily_csv = "daily.csv"   # a per-day export, when you have one

# The console's own end-of-period projection, passed verbatim with its source.
# Delete this table to let the tool project the period-to-date rate instead.
[forecast]
value = 5650.00
source = "billing console projection, which weights recent days"

# The service (or services) the report is built around: donut, split bar,
# verdict and unit economics all use it.
[focus]
service = "Vertex AI"
label = "AI inference"
# services = ["Vertex AI", "Gemini API"]   # several services under one label

# Read the budget from where it is defined (IaC on a fresh default branch, or
# `gcloud billing budgets list`), never from memory.
[budget]
amount = 6000
# When the budget changed inside the period, thresholds are evaluated against
# the budget in force on each day.
previous_amount = 5000
effective_from = 2026-08-10
alert_thresholds = [0.5, 0.75, 0.9, 1.0]

# Optional unit economics: usage counters reported by the product team.
[usage]
source = "the product analytics dashboard"
as_of = "16 Aug 2026"
counters_are_period_to_date = true
# The services that grow when one more unit of work runs.
marginal_services = ["Vertex AI", "Cloud Run"]

[[usage.counters]]
key = "requests"
label = "API requests"
value = 1250000
scales = true

[[usage.counters]]
key = "users"
label = "active users"
value = 840
scales = false
