<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔊 Playing in your Voice Hub</title>
<link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; --bg: #f6f5f2; --text: #1d1e21; --muted: #6b6f76; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121316; --text: #ececec; --muted: #9a9ea6; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
         color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { text-align: center; padding: 24px; }
  .icon { font-size: 40px; }
  small { display: block; color: var(--muted); margin-top: 4px; }
</style>
<script src="/static/handoff.js"></script>
</head>
<body>
<main>
  <div class="icon">🔊</div>
  <b>Playing in your Voice Hub tab</b>
  <small>This tab is not needed: it closes itself, or you can close it.</small>
</main>
</body>
</html>
