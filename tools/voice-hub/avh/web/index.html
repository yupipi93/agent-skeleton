<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice Hub</title>
<meta name="description" content="History and player for the spoken summaries your agents send">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<div id="app">
  <header class="top">
    <button id="topBack" class="icon top-back" type="button" aria-label="Back to notes" title="Back to notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button>
    <a class="brand" href="/" data-nav>
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" class="brand-bg"/><g class="brand-bars"><rect x="7" y="12" width="3" height="8" rx="1.5"/><rect x="12" y="8" width="3" height="16" rx="1.5"/><rect x="17" y="5" width="3" height="22" rx="1.5"/><rect x="22" y="10" width="3" height="12" rx="1.5"/></g></svg>
      <span>Voice Hub</span>
    </a>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 0 4 11.6l4.4 4.4 1.1-1.1-4.4-4.4A6.5 6.5 0 0 0 10.5 4Zm0 1.5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z"/></svg>
      <input id="q" type="search" placeholder="Search notes, tickets, projects" autocomplete="off" enterkeyhint="search">
    </label>
    <button id="themeBtn" class="theme-btn" type="button" aria-label="Theme">🌓</button>
    <button id="queueBtn" class="btn primary" type="button" title="Play everything unheard, oldest first">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span>Unheard</span><b id="unheardCount" class="count"></b>
    </button>
  </header>

  <nav class="filters" aria-label="Filters">
    <div class="chips" id="statusChips" role="radiogroup" aria-label="Status">
      <button class="chip" data-status="" aria-pressed="true">All</button>
      <button class="chip" data-status="unheard" aria-pressed="false">Unheard</button>
      <button class="chip" data-status="starred" aria-pressed="false">Starred</button>
    </div>
    <div class="chips" id="agentChips" aria-label="Agent"></div>
    <button id="markAllBtn" class="chip mark-all" type="button" hidden>✓ Mark all as heard</button>
    <select id="tagSel" aria-label="Project"><option value="">All projects</option></select>
  </nav>

  <main class="layout">
    <section id="list" class="list" aria-label="Voice notes" aria-live="polite"></section>
    <section id="detail" class="detail" aria-label="Note detail"></section>
  </main>

  <footer id="player" class="player" hidden>
    <div class="player-wave" id="playerWave"></div>
    <div class="player-row">
      <button class="player-meta" id="playerMeta" type="button">
        <span class="avatar" id="playerAvatar"></span>
        <span class="player-text"><b id="playerTitle"></b><small id="playerSub"></small></span>
      </button>
      <div class="player-ctl">
        <button class="icon" id="pBack" type="button" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8Z"/><text x="12" y="16.3" text-anchor="middle" font-size="6.5" font-weight="700">10</text></svg></button>
        <button class="icon big" id="pPlay" type="button" aria-label="Play"><svg viewBox="0 0 24 24" class="i-play"><path d="M8 5v14l11-7z"/></svg><svg viewBox="0 0 24 24" class="i-pause"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg></button>
        <button class="icon" id="pFwd" type="button" aria-label="Forward 30 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8Z"/><text x="12" y="16.3" text-anchor="middle" font-size="6.5" font-weight="700">30</text></svg></button>
        <button class="speed" id="pSpeed" type="button" aria-label="Speed">1×</button>
        <button class="icon" id="pNext" type="button" aria-label="Next unheard"><svg viewBox="0 0 24 24"><path d="M6 6l8.5 6L6 18zM16 6h2v12h-2z"/></svg></button>
      </div>
    </div>
  </footer>
  <div id="toast" class="toast" role="status" hidden></div>
  <audio id="audio" preload="metadata"></audio>
</div>
</body>
</html>
